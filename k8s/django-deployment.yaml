apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: analytics
  labels:
    app: django
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
      - name: django
        image: analytics-app:latest
        imagePullPolicy: Never
        command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "True"
        - name: DB_ENGINE
          value: "django.db.backends.sqlite3"
        - name: ALLOWED_HOSTS
          value: "*"
